name: Release to Play Store

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. v6.3.0)'
        required: true
        type: string
      version_code:
        description: 'Version code (integer, must be higher than previous release)'
        required: true
        type: string
      track:
        description: 'Play Store track'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > launch0-upload.keystore
          # Verify the keystore decoded into a valid file
          keytool -list -keystore launch0-upload.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null
          echo "Keystore decoded and verified."

      - name: Build signed release AAB
        run: |
          ./gradlew bundleRelease \
            -PversionNameOverride=${{ inputs.version_name }} \
            -PversionCodeOverride=${{ inputs.version_code }}
        env:
          LAUNCH0_KEYSTORE_FILE: ${{ github.workspace }}/launch0-upload.keystore
          LAUNCH0_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LAUNCH0_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LAUNCH0_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: app.launch0
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          releaseName: "Launch0 ${{ inputs.version_name }}"
          # Commit the release as an unsubmitted change instead of auto-sending it
          # for review. Play refuses automatic submission when the app has changes
          # that must be sent for review from the Console (for example after a
          # policy enforcement), which fails the run after a successful upload.
          # Send the release for review from Publishing overview after the run.
          changesNotSentForReview: true

      - name: Build signed release APK for GitHub Release
        run: |
          ./gradlew assembleRelease \
            -PversionNameOverride=${{ inputs.version_name }} \
            -PversionCodeOverride=${{ inputs.version_code }}
        env:
          LAUNCH0_KEYSTORE_FILE: ${{ github.workspace }}/launch0-upload.keystore
          LAUNCH0_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LAUNCH0_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LAUNCH0_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Release notes come from the F-Droid/IzzyOnDroid changelog for this version
      # code when one is committed, otherwise GitHub generates them from the merged
      # pull requests since the previous release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG" ]; then
            NOTES=(--notes-file "$CHANGELOG")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$VERSION_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Launch0 $VERSION_NAME" \
            "${NOTES[@]}"

      - name: Clean up keystore
        if: always()
        run: rm -f launch0-upload.keystore
